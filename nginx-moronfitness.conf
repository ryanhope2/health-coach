# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name moron.bigpour.app;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name moron.bigpour.app;

    ssl_certificate     /etc/letsencrypt/live/moron.bigpour.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moron.bigpour.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Meal photos can be a few MB; AI parsing calls are slow
    client_max_body_size 15M;
    proxy_read_timeout   120s;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
