{# Shared by the edit-current-period and start-new-period cards. `period` is the row being
   edited (none for a new one); `prefill` carries the current period's targets forward. #}
{% set src = period or prefill %}
<form method="post" action="{{ form_action }}" class="row g-2 guard-double-submit">
  <div class="col-12">
    <label class="form-label small">Name</label>
    <input type="text" name="name" class="form-control" placeholder="e.g. Fall 2026"
           value="{{ period.name if period else '' }}" required>
  </div>
  <div class="col-6">
    <label class="form-label small">Start</label>
    <input type="date" name="start_date" class="form-control"
           value="{{ period.start_date.strftime('%Y-%m-%d') if period else '' }}" required>
  </div>
  <div class="col-6">
    <label class="form-label small">End</label>
    <input type="date" name="end_date" class="form-control"
           value="{{ period.end_date.strftime('%Y-%m-%d') if period else '' }}" required>
  </div>
  <div class="col-4">
    <label class="form-label small">Calories / day</label>
    <input type="number" name="daily_calorie_target" class="form-control"
           value="{{ src.daily_calorie_target if src and src.daily_calorie_target else '' }}">
  </div>
  <div class="col-4">
    <label class="form-label small">Protein (g) / day</label>
    <input type="number" step="0.1" name="daily_protein_target_g" class="form-control"
           value="{{ src.daily_protein_target_g if src and src.daily_protein_target_g else '' }}">
  </div>
  <div class="col-4">
    <label class="form-label small">Exercise days / wk</label>
    <input type="number" name="weekly_exercise_days_target" class="form-control"
           value="{{ src.weekly_exercise_days_target if src and src.weekly_exercise_days_target else 4 }}">
  </div>
  <div class="col-12">
    <button class="btn btn-outline-success">{{ submit_label }}</button>
  </div>
</form>
